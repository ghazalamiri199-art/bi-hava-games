<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bi Hava Games - منچ</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#151515;
    color:white;
    font-family:Arial,sans-serif;
    text-align:center;
}

h1{
    margin:15px 0 5px;
}

#turn{
    margin:8px;
    font-size:17px;
}

.board{
    width:94vw;
    max-width:520px;
    aspect-ratio:1;
    margin:15px auto;
    display:grid;
    grid-template-columns:repeat(15,1fr);
    grid-template-rows:repeat(15,1fr);
    border:5px solid white;
    background:white;
}

.cell{
    border:1px solid #aaa;
    display:flex;
    align-items:center;
    justify-content:center;
    background:white;
}

/* خانه های بازیکنان */

.redHome{
    background:#e53935;
}

.greenHome{
    background:#43a047;
}

.yellowHome{
    background:#fbc02d;
}

.blueHome{
    background:#1e88e5;
}

/* خانه های مسیر */

.redPath{
    background:#ffcdd2;
}

.greenPath{
    background:#c8e6c9;
}

.yellowPath{
    background:#fff9c4;
}

.bluePath{
    background:#bbdefb;
}

/* مرکز */

.center{
    background:white;
    color:#222;
    font-size:11px;
    font-weight:bold;
}

/* مهره ها */

.piece{
    width:65%;
    height:65%;
    border-radius:50%;
    border:3px solid white;
    box-shadow:0 2px 5px #333;
}

.redPiece{
    background:#8b0000;
}

.greenPiece{
    background:#1b5e20;
}

.yellowPiece{
    background:#f57f17;
}

.bluePiece{
    background:#0d47a1;
}

#dice{
    font-size:60px;
    margin:10px;
}

button{
    padding:13px 25px;
    border:0;
    border-radius:12px;
    font-size:18px;
    font-weight:bold;
}

.players{
    display:flex;
    justify-content:center;
    gap:7px;
    flex-wrap:wrap;
    margin:12px;
}

.player{
    padding:8px 12px;
    border-radius:10px;
}

.p-red{
    background:#e53935;
}

.p-green{
    background:#43a047;
}

.p-yellow{
    background:#fbc02d;
    color:#111;
}

.p-blue{
    background:#1e88e5;
}
</style>
</head>

<body>

<h1>🎮 Bi Hava Games</h1>

<div id="turn">
نوبت بازیکن قرمز ❤️
</div>

<div class="board" id="board"></div>

<div id="dice">🎲</div>

<button onclick="rollDice()">
انداختن تاس 🎲
</button>

<div class="players">

<div class="player p-red">
❤️ قرمز
</div>

<div class="player p-green">
💚 سبز
</div>

<div class="player p-yellow">
💛 زرد
</div>

<div class="player p-blue">
💙 آبی
</div>

</div>

<script>

const board = document.getElementById("board");

function createBoard(){

    for(let row=0; row<15; row++){

        for(let col=0; col<15; col++){

            const cell = document.createElement("div");

            cell.className = "cell";

            /* خانه قرمز */

            if(row < 6 && col < 6){
                cell.classList.add("redHome");
            }

            /* خانه سبز */

            else if(row < 6 && col > 8){
                cell.classList.add("greenHome");
            }

            /* خانه آبی */

            else if(row > 8 && col < 6){
                cell.classList.add("blueHome");
            }

            /* خانه زرد */

            else if(row > 8 && col > 8){
                cell.classList.add("yellowHome");
            }

            /* مسیر قرمز */

            if(row == 6 && col >= 1 && col <= 5){
                cell.className = "cell redPath";
            }

            /* مسیر سبز */

            if(col == 8 && row >= 1 && row <= 5){
                cell.className = "cell greenPath";
            }

            /* مسیر زرد */

            if(row == 8 && col >= 9 && col <= 13){
                cell.className = "cell yellowPath";
            }

            /* مسیر آبی */

            if(col == 6 && row >= 9 && row <= 13){
                cell.className = "cell bluePath";
            }

            /* مرکز */

            if(row >= 6 && row <= 8 &&
               col >= 6 && col <= 8){

                cell.className = "cell center";

                if(row == 7 && col == 7){
                    cell.innerHTML = "منچ 🎯";
                }
            }

            board.appendChild(cell);
        }
    }

    addPieces();
}

function addPieces(){

    const pieces = [

        [2,2,"redPiece"],
        [2,4,"redPiece"],
        [4,2,"redPiece"],
        [4,4,"redPiece"],

        [2,10,"greenPiece"],
        [2,12,"greenPiece"],
        [4,10,"greenPiece"],
        [4,12,"greenPiece"],

        [10,2,"bluePiece"],
        [10,4,"bluePiece"],
        [12,2,"bluePiece"],
        [12,4,"bluePiece"],

        [10,10,"yellowPiece"],
        [10,12,"yellowPiece"],
        [12,10,"yellowPiece"],
        [12,12,"yellowPiece"]
    ];

    pieces.forEach(p => {

        const row = p[0];
        const col = p[1];
        const color = p[2];

        const index = row * 15 + col;

        const piece = document.createElement("div");

        piece.className = "piece " + color;

        board.children[index].appendChild(piece);
    });
}

function rollDice(){

    const number =
        Math.floor(Math.random()*6)+1;

    const faces = [
        "",
        "⚀",
        "⚁",
        "⚂",
        "⚃",
        "⚄",
        "⚅"
    ];

    document.getElementById("dice").textContent =
        faces[number];
}

createBoard();

</script>

</body>
    </html>
