<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Bi Hava Games</title>

<style>
body{
    margin:0;
    background:#151515;
    color:white;
    font-family:Arial;
    text-align:center;
}

h1{
    margin-top:20px;
}

#dice{
    font-size:70px;
    margin:25px;
}

button{
    font-size:20px;
    padding:15px 30px;
    border:0;
    border-radius:12px;
}

.board{
    width:90vw;
    max-width:450px;
    aspect-ratio:1;
    margin:20px auto;
    display:grid;
    grid-template-columns:repeat(15,1fr);
    border:5px solid white;
    background:white;
}

.cell{
    border:1px solid #aaa;
    background:#eee;
}

.red{
    background:#e53935;
}

.green{
    background:#43a047;
}

.yellow{
    background:#fbc02d;
}

.blue{
    background:#1e88e5;
}

.piece{
    width:65%;
    height:65%;
    margin:auto;
    margin-top:15%;
    border-radius:50%;
    border:3px solid white;
}

.redPiece{
    background:#8b0000;
}
</style>
</head>

<body>

<h1>🎮 Bi Hava Games</h1>

<div id="turn">نوبت بازیکن قرمز ❤️</div>

<div class="board" id="board"></div>

<div id="dice">🎲</div>

<button onclick="rollDice()">انداختن تاس 🎲</button>

<script>

const dice = document.getElementById("dice");

let position = 0;

const faces = [
    "",
    "⚀",
    "⚁",
    "⚂",
    "⚃",
    "⚄",
    "⚅"
];

function createBoard(){

    const board = document.getElementById("board");

    for(let i = 0; i < 225; i++){

        const cell = document.createElement("div");

        cell.className = "cell";

        if(i < 36){
            cell.classList.add("red");
        }

        if(i >= 189){
            cell.classList.add("blue");
        }

        board.appendChild(cell);
    }

    const firstCell = board.children[32];

    const piece = document.createElement("div");

    piece.className = "piece redPiece";

    piece.id = "redPiece";

    firstCell.appendChild(piece);
}

function rollDice(){

    const number = Math.floor(Math.random() * 6) + 1;

    dice.textContent = faces[number];

    movePiece(number);
}

function movePiece(number){

    const piece = document.getElementById("redPiece");

    position += number;

    if(position > 20){
        position = 20;
    }

    const board = document.getElementById("board");

    const start = 32;

    const newCell = board.children[start + position];

    if(newCell){
        newCell.appendChild(piece);
    }
}

createBoard();

</script>

</body>
</html>
