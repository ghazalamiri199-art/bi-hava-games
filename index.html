<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bi Hava Games - منچ</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#151515;
    color:white;
    text-align:center;
}

h1{
    margin:18px 0 5px;
    font-size:28px;
}

#turn{
    font-size:18px;
    margin:10px;
}

.board{
    width:92vw;
    max-width:520px;
    aspect-ratio:1;
    margin:15px auto;
    display:grid;
    grid-template-columns:repeat(15,1fr);
    grid-template-rows:repeat(15,1fr);
    border:5px solid white;
    background:white;
}

.cell{
    border:1px solid #bbb;
    background:#eee;
}

.red{background:#e53935}
.green{background:#43a047}
.yellow{background:#fbc02d}
.blue{background:#1e88e5}

.center{
    background:white;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#222;
    font-size:12px;
    font-weight:bold;
}

#dice{
    font-size:55px;
    margin:10px;
}

button{
    border:0;
    border-radius:12px;
    padding:13px 25px;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
}

#roll{
    background:#fff;
    color:#111;
}

.players{
    display:flex;
    justify-content:center;
    gap:8px;
    flex-wrap:wrap;
    margin:15px;
}

.player{
    padding:8px 13px;
    border-radius:10px;
    font-size:14px;
}

.p-red{background:#e53935}
.p-green{background:#43a047}
.p-yellow{background:#fbc02d;color:#111}
.p-blue{background:#1e88e5}
</style>
</head>

<body>

<h1>🎮 Bi Hava Games</h1>

<div id="turn">نوبت بازیکن قرمز ❤️</div>

<div class="board" id="board"></div>

<div id="dice">🎲</div>

<button id="roll">انداختن تاس</button>

<div class="players">
    <div class="player p-red">❤️ قرمز</div>
    <div class="player p-green">💚 سبز</div>
    <div class="player p-yellow">💛 زرد</div>
    <div class="player p-blue">💙 آبی</div>
</div>

<script>

const board = document.getElementById("board");
const turnText = document.getElementById("turn");
const dice = document.getElementById("dice");
const rollButton = document.getElementById("roll");

const names = [
    "قرمز ❤️",
    "سبز 💚",
    "زرد 💛",
    "آبی 💙"
];

let currentPlayer = 0;

function createBoard(){

    board.innerHTML = "";

    for(let row=0; row<15; row++){

        for(let col=0; col<15; col++){

            const cell = document.createElement("div");
            cell.className = "cell";

            if(row < 6 && col < 6){
                cell.classList.add("red");
            }

            if(row < 6 && col > 8){
                cell.classList.add("green");
            }

            if(row > 8 && col < 6){
                cell.classList.add("blue");
            }

            if(row > 8 && col > 8){
                cell.classList.add("yellow");
            }

            if(row >= 6 && row <= 8 &&
               col >= 6 && col <= 8){

                cell.className = "cell center";

                if(row === 7 && col === 7){
                    cell.textContent = "منچ 🎯";
                }
            }

            board.appendChild(cell);
        }
    }
}

function rollDice(){

    const number = Math.floor(Math.random()*6)+1;

    const diceFaces = [
        "",
        "⚀",
        "⚁",
        "⚂",
        "⚃",
        "⚄",
        "⚅"
    ];

    dice.textContent = diceFaces[number];

    if(number !== 6){
        currentPlayer++;

        if(currentPlayer >= 4){
            currentPlayer = 0;
        }
    }

    turnText.textContent =
        "نوبت بازیکن " + names[currentPlayer];
}

rollButton.addEventListener("click", rollDice);

createBoard();

</script>

</body>
 </html>
