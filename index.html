<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bi Hava Games - منچ</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#151515;
    color:white;
    text-align:center;
}

h1{
    margin:15px 0 5px;
    font-size:27px;
}

#turn{
    font-size:17px;
    margin:8px;
}

.board{
    width:94vw;
    max-width:520px;
    aspect-ratio:1;
    margin:12px auto;
    display:grid;
    grid-template-columns:repeat(15,1fr);
    grid-template-rows:repeat(15,1fr);
    border:5px solid white;
    background:white;
}

.cell{
    border:1px solid #aaa;
    background:#eee;
    display:flex;
    align-items:center;
    justify-content:center;
}

.redHome{background:#e53935;}
.greenHome{background:#43a047;}
.yellowHome{background:#fbc02d;}
.blueHome{background:#1e88e5;}

.redPath{background:#ef9a9a;}
.greenPath{background:#a5d6a7;}
.yellowPath{background:#fff59d;}
.bluePath{background:#90caf9;}

.center{
    background:white;
    color:#222;
    font-size:12px;
    font-weight:bold;
}

.piece{
    width:70%;
    height:70%;
    border-radius:50%;
    border:3px solid white;
    box-shadow:0 2px 5px #222;
    transition:0.3s;
}

.redPiece{background:#b71c1c;}
.greenPiece{background:#1b5e20;}
.yellowPiece{background:#f57f17;}
.bluePiece{background:#0d47a1;}

#dice{
    font-size:55px;
    margin:8px;
}

button{
    border:0;
    border-radius:12px;
    padding:13px 25px;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
}

#roll{
    background:white;
    color:#111;
}

.players{
    display:flex;
    justify-content:center;
    gap:7px;
    flex-wrap:wrap;
    margin:12px;
}

.player{
    padding:8px 12px;
    border-radius:10px;
    font-size:14px;
}

.p-red{background:#e53935;}
.p-green{background:#43a047;}
.p-yellow{background:#fbc02d;color:#111;}
.p-blue{background:#1e88e5;}
</style>
</head>

<body>

<h1>🎮 Bi Hava Games</h1>

<div id="turn">نوبت بازیکن قرمز ❤️</div>

<div class="board" id="board"></div>

<div id="dice">🎲</div>

<button id="roll">انداختن تاس</button>

<div class="players">
    <div class="player p-red">❤️ قرمز</div>
    <div class="player p-green">💚 سبز</div>
    <div class="player p-yellow">💛 زرد</div>
    <div class="player p-blue">💙 آبی</div>
</div>

<script>

const board = document.getElementById("board");
const turnText = document.getElementById("turn");
const dice = document.getElementById("dice");
const rollButton = document.getElementById("roll");

const names = [
    "قرمز ❤️",
    "سبز 💚",
    "زرد 💛",
    "آبی 💙"
];

let currentPlayer = 0;
let redPosition = 0;

function createBoard(){

    board.innerHTML = "";

    for(let row=0; row<15; row++){

        for(let col=0; col<15; col++){

            const cell = document.createElement("div");
            cell.className = "cell";

            if(row < 6 && col < 6){
                cell.className = "cell redHome";
            }
            else if(row < 6 && col > 8){
                cell.className = "cell greenHome";
            }
            else if(row > 8 && col < 6){
                cell.className = "cell blueHome";
            }
