<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bi Hava Games - منچ</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#151515;
    color:white;
    text-align:center;
}

h1{
    margin:18px 0 5px;
    font-size:28px;
}

#turn{
    font-size:18px;
    margin:10px;
}

.board{
    width:92vw;
    max-width:520px;
    aspect-ratio:1;
    margin:15px auto;
    display:grid;
    grid-template-columns:repeat(15,1fr);
    grid-template-rows:repeat(15,1fr);
    border:5px solid white;
    background:white;
}

.cell{
    border:1px solid #bbb;
    background:#eee;
    display:flex;
    align-items:center;
    justify-content:center;
}

.red{background:#e53935}
.green{background:#43a047}
.yellow{background:#fbc02d}
.blue{background:#1e88e5}

.home{
    position:relative;
}

.piece{
    width:65%;
    height:65%;
    border-radius:50%;
    border:3px solid white;
    box-shadow:0 2px 5px #222;
}

.center{
    background:white;
    color:#222;
    font-size:12px;
    font-weight:bold;
}

#dice{
    font-size:55px;
    margin:10px;
}

button{
    border:0;
    border-radius:12px;
    padding:13px 25px;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
}

#roll{
    background:white;
    color:#111;
}

.players{
    display:flex;
    justify-content:center;
    gap:8px;
    flex-wrap:wrap;
    margin:15px;
}

.player{
    padding:8px 13px;
    border-radius:10px;
    font-size:14px;
}

.p-red{background:#e53935}
.p-green{background:#43a047}
.p-yellow{background:#fbc02d;color:#111}
.p-blue{background:#1e
