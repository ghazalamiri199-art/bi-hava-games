<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>بازی حکم</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #126b45;
      color: white;
      font-family: Arial, Tahoma, sans-serif;
      text-align: center;
    }

    h1 {
      margin: 20px 0;
    }

    .table {
      width: 94%;
      max-width: 700px;
      min-height: 650px;
      margin: auto;
      position: relative;
      background: #08733f;
      border: 8px solid #70452a;
      border-radius: 35px;
      padding: 20px;
    }

    .player {
      position: absolute;
      padding: 8px 14px;
      background: rgba(0, 0, 0, 0.35);
      border-radius: 12px;
      font-weight: bold;
    }

    .top {
      top: 15px;
      left: 50%;
      transform: translateX(-50%);
    }

    .bottom {
      bottom: 15px;
      left: 50%;
      transform: translateX(-50%);
    }

    .left {
      left: 10px;
      top: 50%;
      transform: translateY(-50%);
    }

    .right {
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
    }

    .center {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 90%;
      max-height: 600px;
      overflow-y: auto;
    }

    .cards {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      margin-top: 15px;
    }

    .card {
      width: 48px;
      height: 70px;
      background: white;
      color: black;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      font-weight: bold;
      box-shadow: 0 3px 7px rgba(0,0,0,0.4);
      cursor: pointer;
      user-select: none;
    }

    .card:hover {
      transform: translateY(-5px);
    }

    .red {
      color: #d11;
    }

    .disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    button {
      margin: 8px;
      padding: 12px 18px;
      border: none;
      border-radius: 10px;
      font-size: 17px;
      cursor: pointer;
      font-weight: bold;
    }

    .suit-button {
      font-size: 30px;
      min-width: 65px;
    }

    .red-button {
      color: #d11;
    }

    #gameArea {
      display: none;
    }

    .playerBox {
      margin: 15px 0;
      padding: 12px;
      background: rgba(0,0,0,0.2);
      border-radius: 12px;
    }

    .playerBox h3 {
      margin: 5px;
    }

    #myHandArea {
      margin-top: 25px;
    }

    #myHand {
      margin-top: 15px;
    }

    #playedCards {
      margin-top: 25px;
      min-height: 100px;
    }

    .message {
      margin: 15px 0;
      font-size: 18px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <h1>🃏 بازی حکم</h1>

  <div class="table">

    <div class="player top">بازیکن ۲</div>
    <div class="player left">بازیکن ۳</div>
    <div class="player right">بازیکن ۴</div>
    <div class="player bottom">شما</div>

    <div class="center">

      <div id="startArea">

        <h2>👑 تعیین حاکم</h2>

        <p>برای شروع بازی، حاکم را مشخص کنید.</p>

        <button onclick="chooseHokm()">تعیین حاکم</button>

        <div id="hokmInfo"></div>

      </div>

      <div id="gameArea">

        <h2>👑 حاکم: <span id="kingName"></span></h2>

        <p>۵ کارت اول حاکم:</p>

        <div id="cards" class="cards"></div>

        <div id="trumpArea">

          <h3>خال حکم را انتخاب کنید:</h3>

          <button class="suit-button" onclick="chooseTrump('♠')">♠</button>

          <button class="suit-button red-button" onclick="chooseTrump('♥')">♥</button>

          <button class="suit-button red-button" onclick="chooseTrump('♦')">♦</button>

          <button class="suit-button" onclick="chooseTrump('♣')">♣</button>

        </div>

        <div id="info" class="message">
          منتظر انتخاب حکم...
        </div>

        <div id="myHandArea" style="display:none;">

          <h2>🎴 دست شما</h2>

          <div id="myHand" class="cards"></div>

        </div>

        <div id="playedCards">

          <h3>🃏 کارت‌های بازی‌شده</h3>

          <div id="currentTrick" class="cards"></div>

        </div>

      </div>

    </div>

  </div>

  <script>

    const suits = ["♠", "♥", "♦", "♣"];

    const ranks = [
      "A", "K", "Q", "J", "10",
      "9", "8", "7", "6", "5",
      "4", "3", "2"
    ];

    const players = [
      "شما",
      "بازیکن ۲",
      "بازیکن ۳",
      "بازیکن ۴"
    ];

    let deck = [];
    let king = "";
    let trump = "";
    let kingFirstFive = [];

    let hands = {
      "شما": [],
      "بازیکن ۲": [],
      "بازیکن ۳": [],
      "بازیکن ۴": []
    };

    let currentTrick = [];
    let leadSuit = "";

    function createDeck() {

      deck = [];

      for (let suit of suits) {

        for (let rank of ranks) {

          deck.push({
            suit: suit,
            rank: rank
          });

        }

      }

    }

    function shuffleDeck() {

      for (let i = deck.length - 1; i > 0; i--) {

        const j =
          Math.floor(Math.random() * (i + 1));

        const temp = deck[i];

        deck[i] = deck[j];

        deck[j] = temp;

      }

    }

    function chooseHokm() {

      king =
        players[
          Math.floor(Math.random() * players.length)
        ];

      document.getElementById("hokmInfo").textContent =
        "👑 حاکم شد: " + king;

      createDeck();
      shuffleDeck();

      kingFirstFive =
        deck.slice(0, 5);

      setTimeout(function() {

        document.getElementById("startArea")
          .style.display = "none";

        document.getElementById("gameArea")
          .style.display = "block";

        document.getElementById("kingName")
          .textContent = king;

        showCards(
          kingFirstFive,
          document.getElementById("cards")
        );

      }, 800);

    }

    function showCards(cardList, area) {

      area.innerHTML = "";

      for (let card of cardList) {

        const cardElement =
          document.createElement("div");

        cardElement.className = "card";

        if (
          card.suit === "♥" ||
          card.suit === "♦"
        ) {

          cardElement.classList.add("red");

        }

        cardElement.textContent =
          card.rank + card.suit;

        area.appendChild(cardElement);

      }

    }

    function chooseTrump(selectedSuit) {

      trump = selectedSuit;

      document.getElementById("info").textContent =
        "حکم انتخاب شد: " + trump + " 🃏";

      document.getElementById("trumpArea").innerHTML =
        "<h3>حکم بازی: " + trump + "</h3>";

      dealAllCards();

    }

    function dealAllCards() {

      hands = {
        "شما": [],
        "بازیکن ۲": [],
        "بازیکن ۳": [],
        "بازیکن ۴": []
      };

      let remainingDeck =
        deck.slice(5);

      hands[king] =
        kingFirstFive.slice();

      hands[king] =
        hands[king].concat(
          remainingDeck.slice(0, 8)
        );

      let position = 8;

      for (let player of players) {

        if (player === king) {
          continue;
        }

        hands[player] =
          remainingDeck.slice(
            position,
            position + 13
          );

        position += 13;

      }

      showMyHand();

    }

    function showMyHand() {

      const myHandArea =
        document.getElementById("myHandArea");

      const myHand =
        document.getElementById("myHand");

      myHandArea.style.display = "block";

      myHand.innerHTML = "";

      hands["شما"].forEach(
        function(card, index) {

          const cardElement =
            document.createElement("div");

          cardElement.className = "card";

          if (
            card.suit === "♥" ||
            card.suit === "♦"
          ) {

            cardElement.classList.add("red");

          }

          cardElement.textContent =
            card.rank + card.suit;

          cardElement.onclick =
            function() {
              playMyCard(index);
            };

          myHand.appendChild(cardElement);

        }
      );

      document.getElementById("info").textContent =
        "🎴 نوبت شماست؛ یک کارت انتخاب کنید.";

    }

    function playMyCard(index) {

      const card =
        hands["شما"][index];

      /*
        اگر خال شروع مشخص شده باشد
        و شما از آن خال داشته باشید،
        باید همان خال را بازی کنید.
      */

      if (
        leadSuit !== "" &&
        hasSuit("شما", leadSuit) &&
        card.suit !== leadSuit
      ) {

        document.getElementById("info").textContent =
          "⚠️ باید از خال " +
          leadSuit +
          " بازی کنید.";

        return;

      }

      if (currentTrick.length === 0) {

        leadSuit = card.suit;

      }

      currentTrick.push({
        player: "شما",
        card: card
      });

      hands["شما"].splice(index, 1);

      showCurrentTrick();
playNextPlayer();
      document.getElementById("info").textContent =
        "کارت شما بازی شد: " +
        card.rank +
        card.suit;

      showMyHand();

    }

    function hasSuit(player, suit) {

      return hands[player].some(
        function(card) {
          return card.suit === suit;
        }
      );

    }

    function showCurrentTrick() {

      const area =
        document.getElementById("currentTrick");

      area.innerHTML = "";

      for (let play of currentTrick) {

        const box =
          document.createElement("div");

        box.className = "card";

        if (
          play.card.suit === "♥" ||
          play.card.suit === "♦"
        ) {

          box.classList.add("red");

        }

        box.textContent =
          play.player +
          " " +
          play.card.rank +
          play.card.suit;

        area.appendChild(box);

      }

    }
  }function playNextPlayer() {

  if (currentTrick.length >= 4) {
    return;
  }

  const nextPlayer =
    players[currentTrick.length];

  if (nextPlayer === "شما") {
    return;
  }

  const validCards =
    hands[nextPlayer].filter(function(card) {

      if (leadSuit === "") {
        return true;
      }

      if (hasSuit(nextPlayer, leadSuit)) {
        return card.suit === leadSuit;
      }

      return true;

    });

  const randomCard =
    validCards[
      Math.floor(Math.random() * validCards.length)
    ];

  const cardIndex =
    hands[nextPlayer].indexOf(randomCard);

  hands[nextPlayer].splice(cardIndex, 1);

  currentTrick.push({
    player: nextPlayer,
    card: randomCard
  });

  showCurrentTrick();

  if (currentTrick.length < 4) {

    setTimeout(function() {
      playNextPlayer();
    }, 700);

  } else {

    const winner = findTrickWinner();

document.getElementById("info").textContent =
  "🏆 برنده این دور: " + winner;

    setTimeout(function() {

      currentTrick = [];
      leadSuit = "";

      showCurrentTrick();

      document.getElementById("info").textContent =
        "🎴 نوبت شماست؛ یک کارت انتخاب کنید.";

    }, 1500);

  }
}

function findTrickWinner() {

  const lead = currentTrick[0].card.suit;

  let winner = currentTrick[0];

  for (let i = 1; i < currentTrick.length; i++) {

    const current = currentTrick[i];

    if (
      current.card.suit === trump &&
      winner.card.suit !== trump
    ) {
      winner = current;
      continue;
    }

    if (
      current.card.suit === winner.card.suit &&
      current.card.suit === trump
    ) {
      if (
        ranks.indexOf(current.card.rank) <
        ranks.indexOf(winner.card.rank)
      ) {
        winner = current;
      }
      continue;
    }

    if (
      winner.card.suit !== trump &&
      current.card.suit === lead &&
      winner.card.suit === lead
    ) {
      if (
        ranks.indexOf(current.card.rank) <
        ranks.indexOf(winner.card.rank)
      ) {
        winner = current;
      }
    }

  }

  return winner.player;
    
    }
  </script>

</body>
  </html>
