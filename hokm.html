<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>بازی حکم</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #126b45;
      color: white;
      font-family: Arial, Tahoma, sans-serif;
      text-align: center;
    }

    h1 {
      margin: 20px 0;
    }

    .table {
      width: 94%;
      max-width: 700px;
      min-height: 650px;
      margin: auto;
      position: relative;
      background: #08733f;
      border: 8px solid #70452a;
      border-radius: 35px;
      padding: 20px;
    }

    .player {
      position: absolute;
      padding: 8px 14px;
      background: rgba(0, 0, 0, 0.35);
      border-radius: 12px;
      font-weight: bold;
    }

    .top {
      top: 15px;
      left: 50%;
      transform: translateX(-50%);
    }

    .bottom {
      bottom: 15px;
      left: 50%;
      transform: translateX(-50%);
    }

    .left {
      left: 10px;
      top: 50%;
      transform: translateY(-50%);
    }

    .right {
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
    }

    .center {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 90%;
      max-height: 600px;
      overflow-y: auto;
    }

    .cards {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      margin-top: 15px;
    }

    .card {
      width: 48px;
      height: 70px;
      background: white;
      color: black;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      font-weight: bold;
      box-shadow: 0 3px 7px rgba(0,0,0,0.4);
    }

    .red {
      color: #d11;
    }

    button {
      margin: 8px;
      padding: 12px 18px;
      border: none;
      border-radius: 10px;
      font-size: 17px;
      cursor: pointer;
      font-weight: bold;
    }

    .suit-button {
      font-size: 30px;
      min-width: 65px;
    }

    .red-button {
      color: #d11;
    }

    #gameArea {
      display: none;
    }

    .playerBox {
      margin: 15px 0;
      padding: 12px;
      background: rgba(0,0,0,0.2);
      border-radius: 12px;
    }

    .playerBox h3 {
      margin: 5px;
    }
  </style>
</head>

<body>

  <h1>🃏 بازی حکم</h1>

  <div class="table">

    <div class="player top">بازیکن ۲</div>
    <div class="player left">بازیکن ۳</div>
    <div class="player right">بازیکن ۴</div>
    <div class="player bottom">شما</div>

    <div class="center">

      <div id="startArea">

        <h2>👑 تعیین حاکم</h2>

        <p>برای شروع بازی، حاکم را مشخص کنید.</p>

        <button onclick="chooseHokm()">تعیین حاکم</button>

        <div id="hokmInfo"></div>

      </div>

      <div id="gameArea">

        <h2>👑 حاکم: <span id="kingName"></span></h2>

        <p>۵ کارت اول حاکم:</p>

        <div id="cards" class="cards"></div>

        <div id="trumpArea">

          <h3>خال حکم را انتخاب کنید:</h3>

          <button class="suit-button" onclick="chooseTrump('♠')">♠</button>

          <button class="suit-button red-button" onclick="chooseTrump('♥')">♥</button>

          <button class="suit-button red-button" onclick="chooseTrump('♦')">♦</button>

          <button class="suit-button" onclick="chooseTrump('♣')">♣</button>

        </div>

        <div id="info">
          منتظر انتخاب حکم...
        </div>

        <div id="playersCards"></div>

      </div>

    </div>

  </div>

  <script>

    const suits = ["♠", "♥", "♦", "♣"];

    const ranks = [
      "A", "K", "Q", "J", "10",
      "9", "8", "7", "6", "5",
      "4", "3", "2"
    ];

    const players = [
      "شما",
      "بازیکن ۲",
      "بازیکن ۳",
      "بازیکن ۴"
    ];

    let deck = [];
    let king = "";
    let trump = "";
    let kingFirstFive = [];

    function createDeck() {

      deck = [];

      for (let suit of suits) {

        for (let rank of ranks) {

          deck.push({
            suit: suit,
            rank: rank
          });

        }

      }

    }

    function shuffleDeck() {

      for (let i = deck.length - 1; i > 0; i--) {

        const j = Math.floor(Math.random() * (i + 1));

        const temp = deck[i];

        deck[i] = deck[j];

        deck[j] = temp;

      }

    }

    function chooseHokm() {

      king =
        players[Math.floor(Math.random() * players.length)];

      document.getElementById("hokmInfo").textContent =
        "👑 حاکم شد: " + king;

      createDeck();
      shuffleDeck();

      kingFirstFive = deck.slice(0, 5);

      setTimeout(function() {

        document.getElementById("startArea").style.display = "none";

        document.getElementById("gameArea").style.display = "block";

        document.getElementById("kingName").textContent = king;

        showCards(
          kingFirstFive,
          document.getElementById("cards")
        );

      }, 800);

    }

    function showCards(cardList, area) {

      area.innerHTML = "";

      for (let card of cardList) {

        const cardElement =
          document.createElement("div");

        cardElement.className = "card";

        if (
          card.suit === "♥" ||
          card.suit === "♦"
        ) {

          cardElement.classList.add("red");

        }

        cardElement.textContent =
          card.rank + card.suit;

        area.appendChild(cardElement);

      }

    }

    function chooseTrump(selectedSuit) {

      trump = selectedSuit;

      document.getElementById("info").textContent =
        "حکم انتخاب شد: " + trump + " 🃏";

      document.getElementById("trumpArea").innerHTML =
        "<h3>حکم بازی: " + trump + "</h3>";

      dealAllCards();

    }

    function dealAllCards() {

      /*
        ۵ کارت اول قبلاً به حاکم داده شده.
        این ۵ کارت را نگه می‌داریم.
      */

      let remainingDeck = deck.slice(5);

      let hands = {};

      for (let player of players) {
        hands[player] = [];
      }

      /*
        ۵ کارت اول حاکم
      */

      hands[king] = kingFirstFive.slice();

      /*
        ۸ کارت بعدی برای کامل شدن ۱۳ کارت حاکم
      */

      hands[king] =
        hands[king].concat(remainingDeck.slice(0, 8));

      /*
        ۳۹ کارت باقی‌مانده:
        ۱۳ کارت برای هر یک از سه بازیکن دیگر
      */

      let position = 8;

      for (let player of players) {

        if (player === king) {
          continue;
        }

        hands[player] =
          remainingDeck.slice(position, position + 13);

        position += 13;

      }

      showAllHands(hands);

    }

    function showAllHands(hands) {

      const playersCards =
        document.getElementById("playersCards");

      playersCards.innerHTML =
        "<h2>🃏 دست کامل بازیکنان</h2>";

      for (let player of players) {

        const playerBox =
          document.createElement("div");

        playerBox.className = "playerBox";

        const title =
          document.createElement("h3");

        title.textContent =
          player + " — " + hands[player].length + " کارت";

        playerBox.appendChild(title);

        const cards =
          document.createElement("div");

        cards.className = "cards";

        showCards(hands[player], cards);

        playerBox.appendChild(cards);

        playersCards.appendChild(playerBox);

      }

    }

  </script>

</body>
  </html>
