<!DOCTYPE html> <html lang="fa" dir="rtl"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>بازی حکم</title> <style> * { box-sizing: border-box; } body { margin: 0; min-height: 100vh; background: #126b45; color: white; font-family: Arial, Tahoma, sans-serif; text-align: center; } h1 { margin: 25px 0; font-size: 30px; } .table { width: 92%; max-width: 600px; height: 600px; margin: auto; position: relative; background: #08733f; border: 8px solid #70452a; border-radius: 35px; } .player { position: absolute; padding: 10px 16px; background: rgba(0, 0, 0, 0.35); border-radius: 12px; font-weight: bold; } .top { top: 15px; left: 50%; transform: translateX(-50%); } .bottom { bottom: 15px; left: 50%; transform: translateX(-50%); } .left { left: 10px; top: 50%; transform: translateY(-50%); } .right { right: 10px; top: 50%; transform: translateY(-50%); } .center { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); } .suits { margin-top: 20px; font-size: 42px; letter-spacing: 10px; } .message { margin: 20px auto; width: 90%; max-width: 600px; padding: 12px; background: rgba(0, 0, 0, 0.3); border-radius: 12px; } </style> </head> <body> <h1>🃏 بازی حکم</h1> <div class="table"> <div class="player top">بازیکن ۲</div> <div class="player left">بازیکن ۳</div> <div class="player right">بازیکن ۴</div> <div class="player bottom">شما</div> <div class="center"> <div>میز بازی</div> <div class="suits">♠ ♥ ♦ ♣</div> </div> </div> <div class="message"> مرحله اول با موفقیت آماده شد 🃏 </div> </body> </html>
