<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>بازی حکم</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #126b45;
      color: white;
      font-family: Arial, Tahoma, sans-serif;
      text-align: center;
    }

    h1 {
      margin: 20px 0;
    }

    .table {
      width: 94%;
      max-width: 700px;
      min-height: 650px;
      margin: auto;
      position: relative;
      background: #08733f;
      border: 8px solid #70452a;
      border-radius: 35px;
      padding: 20px;
    }

    .player {
      position: absolute;
      padding: 8px 14px;
      background: rgba(0, 0, 0, 0.35);
      border-radius: 12px;
      font-weight: bold;
    }

    .top {
      top: 15px;
      left: 50%;
      transform: translateX(-50%);
    }

    .bottom {
      bottom: 15px;
      left: 50%;
      transform: translateX(-50%);
    }

    .left {
      left: 10px;
      top: 50%;
      transform: translateY(-50%);
    }

    .right {
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
    }

    .center {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 90%;
    }

    .cards {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      margin-top: 15px;
    }

    .card {
      width: 48px;
      height: 70px;
      background: white;
      color: black;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      font-weight: bold;
      box-shadow: 0 3px 7px rgba(0,0,0,0.4);
    }

    .red {
      color: #d11;
    }

    button {
      margin: 8px;
      padding: 12px 18px;
      border: none;
      border-radius: 10px;
      font-size: 17px;
      cursor: pointer;
      font-weight: bold;
    }

    .suit-button {
      font-size: 30px;
      min-width: 65px;
    }

    .red-button {
      color: #d11;
    }

    #gameArea {
      display: none;
    }

    #playersCards {
      margin-top: 20px;
    }

    .playerBox {
      margin: 12px 0;
      padding: 10px;
      background: rgba(0,0,0,0.2);
      border-radius: 12px;
    }
  </style>
</head>

<body>

  <h1>🃏 بازی حکم</h1>

  <div class="table">

    <div class="player top">بازیکن ۲</div>
    <div class="player left">بازیکن ۳</div>
    <div class="player right">بازیکن ۴</div>
    <div class="player bottom">شما</div>

    <div class="center">

      <div id="startArea">

        <h2>👑 تعیین حاکم</h2>

        <p>برای شروع بازی، حاکم را مشخص کنید.</p>

        <button onclick="chooseHokm()">تعیین حاکم</button>

        <div id="hokmInfo"></div>

      </div>

      <div id="gameArea">

        <h2>👑 حاکم: <span id="kingName"></span></h2>

        <p>۵ کارت اول حاکم:</p>

        <div id="cards" class="cards"></div>

        <div id="trumpArea">

          <h3>خال حکم را انتخاب کنید:</h3>

          <button class="suit-button" onclick="chooseTrump('♠')">♠</button>

          <button class="suit-button red-button" onclick="chooseTrump('♥')">♥</button>

          <button class="suit-button red-button" onclick="chooseTrump('♦')">♦</button>

          <button class="suit-button" onclick="chooseTrump('♣')">♣</button>

        </div>

        <div id="info">
          منتظر انتخاب حکم...
        </div>

        <div id="playersCards"></div>

      </div>

    </div>

  </div>

  <script>

    const suits = ["♠", "♥", "♦", "♣"];

    const ranks = [
      "A", "K", "Q", "J", "10",
      "9", "8", "7", "6", "5",
      "4", "3", "2"
    ];

    let deck = [];
    let king = "";
    let trump = "";

    function createDeck() {

      deck = [];

      for (let suit of suits) {

        for (let rank of ranks) {

          deck.push({
            suit: suit,
            rank: rank
          });

        }

      }

    }

    function shuffleDeck() {

      for (let i = deck.length - 1; i > 0; i--) {

        const j = Math.floor(Math.random() * (i + 1));

        const temp = deck[i];

        deck[i] = deck[j];

        deck[j] = temp;

      }

    }

    function chooseHokm() {

      const players = [
        "شما",
        "بازیکن ۲",
        "بازیکن ۳",
        "بازیکن ۴"
      ];

      king = players[Math.floor(Math.random() * players.length)];

      document.getElementById("hokmInfo").textContent =
        "👑 حاکم شد: " + king;

      setTimeout(function() {

        document.getElementById("startArea").style.display = "none";

        document.getElementById("gameArea").style.display = "block";

        document.getElementById("kingName").textContent = king;

        dealFirstCards();

      }, 800);

    }

    function dealFirstCards() {

      createDeck();
      shuffleDeck();

      const firstCards = deck.slice(0, 5);

      const cardsArea = document.getElementById("cards");

      cardsArea.innerHTML = "";

      for (let card of firstCards) {

        const cardElement = document.createElement("div");

        cardElement.className = "card";

        if (
          card.suit === "♥" ||
          card.suit === "♦"
        ) {
          cardElement.classList.add("red");
        }

        cardElement.textContent =
          card.rank + card.suit;

        cardsArea.appendChild(cardElement);

      }

    }

    function chooseTrump(selectedSuit) {

      trump = selectedSuit;

      document.getElementById("info").textContent =
        "حکم انتخاب شد: " + trump + " 🃏";

      document.getElementById("trumpArea").innerHTML =
        "<h3>حکم بازی: " + trump + "</h3>";

      dealAllCards();

    }

    function dealAllCards() {

      createDeck();
      shuffleDeck();

      const players = [
        "شما",
        "بازیکن ۲",
        "بازیکن ۳",
        "بازیکن ۴"
      ];

      const playersCards =
        document.getElementById("playersCards");

      playersCards.innerHTML =
        "<h3>🃏 کارت‌های پخش‌شده</h3>";

      for (let i = 0; i < players.length; i++) {

        const playerBox =
          document.createElement("div");

        playerBox.className = "playerBox";

        const title =
          document.createElement("h4");

        title.textContent = players[i];

        playerBox.appendChild(title);

        const cards =
          document.createElement("div");

        cards.className = "cards";

        const playerCards =
          deck.slice(i * 13, (i + 1) * 13);

        for (let card of playerCards) {

          const cardElement =
            document.createElement("div");

          cardElement.className = "card";

          if (
            card.suit === "♥" ||
            card.suit === "♦"
          ) {
            cardElement.classList.add("red");
          }

          cardElement.textContent =
            card.rank + card.suit;

          cards.appendChild(cardElement);

        }

        playerBox.appendChild(cards);

        playersCards.appendChild(playerBox);

      }

    }

  </script>

</body>
  </html>
