<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>بازی حکم</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #126b45;
      color: white;
      font-family: Arial, Tahoma, sans-serif;
      text-align: center;
    }

    h1 {
      margin: 20px 0;
    }

.table {
  width: 96%;
  max-width: 500px;
  min-height: 720px;
  margin: 10px auto;
  position: relative;
  background: #08733f;
  border: 6px solid #d4af37;
  border-radius: 45%;
  padding: 10px;
  box-shadow: 0 0 20px rgba(0,0,0,0.5);
}

.player {
  position: absolute;
  padding: 6px 12px;
  background: rgba(0, 0, 0, 0.55);
  border: 2px solid #d4af37;
  border-radius: 18px;
  font-weight: bold;
  font-size: 14px;
  z-index: 5;
  white-space: nowrap;
}
    .top {
  top: 20px;
  left: 50%;
  transform: translateX(-50%);
}

.bottom {
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
}

.left {
  left: 15px;
  top: 50%;
  transform: translateY(-50%);
}

.right {
  right: 15px;
  top: 50%;
  transform: translateY(-50%);
}

    .center {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 90%;
      max-height: 600px;
      overflow-y: auto;
    }

    .cards {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      margin-top: 15px;
    }
.card {
  width: 52px;
  height: 76px;
  background: white;
  color: black;
  border: 2px solid #222;
  border-radius: 9px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 21px;
  font-weight: bold;
  box-shadow: 0 3px 8px rgba(0,0,0,0.45);
  cursor: pointer;
  user-select: none;
  transition: transform 0.15s ease;
  }

    .card:hover {
      transform: translateY(-5px);
    }

    .red {
      color: #d11;
    }

    .disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    button {
      margin: 8px;
      padding: 12px 18px;
      border: none;
      border-radius: 10px;
      font-size: 17px;
      cursor: pointer;
      font-weight: bold;
    }

    .suit-button {
      font-size: 30px;
      min-width: 65px;
    }

    .red-button {
      color: #d11;
    }

    #gameArea {
      display: none;
    }

    .playerBox {
      margin: 15px 0;
      padding: 12px;
      background: rgba(0,0,0,0.2);
      border-radius: 12px;
    }

    .playerBox h3 {
      margin: 5px;
    }

    #myHandArea {
      margin-top: 25px;
    }

    #myHand {
  margin-top: 15px;
  display: flex;
  justify-content: center;
  align-items: flex-end;
  flex-wrap: nowrap;
  direction: ltr;
  overflow-x: auto;
  padding: 10px 5px 15px;
    }
#myHand .card {
  flex: 0 0 auto;
  margin-left: -18px;
}

#myHand .card:first-child {
  margin-left: 0;
  }
 .opponentHand {
  position: absolute;
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 3;
}

.opponentHand .backCard {
  width: 34px;
  height: 50px;
  background: #263238;
  border: 2px solid #d4af37;
  border-radius: 6px;
  margin-left: -20px;
  box-shadow: 0 2px 5px rgba(0,0,0,0.4);
}

.opponentHand .backCard:first-child {
  margin-left: 0;
}

.topHand {
  top: 75px;
  left: 50%;
  transform: translateX(-50%);
}

.leftHand {
  left: 55px;
  top: 50%;
  transform: translateY(-50%) rotate(90deg);
}

.rightHand {
  right: 55px;
  top: 50%;
  transform: translateY(-50%) rotate(90deg);
  }     
#playedCards {
  margin-top: 0;
  min-height: 100px;
}

#currentTrick {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  z-index: 10;
  }
    .message {
      margin: 15px 0;
      font-size: 18px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <h1>🃏 بازی حکم</h1>

  <div class="table">

    <div class="player top">بازیکن ۲</div>
    <div class="player left">بازیکن ۳</div>
    <div class="player right">بازیکن ۴</div>
    <div class="player bottom">شما</div>
<div id="handTop" class="opponentHand topHand"></div>
<div id="handLeft" class="opponentHand leftHand"></div>
<div id="handRight" class="opponentHand rightHand"></div>
    <div class="center">

      <div id="startArea">

        <h2>👑 تعیین حاکم</h2>

        <p>برای شروع بازی، حاکم را مشخص کنید.</p>

        <button onclick="chooseHokm()">تعیین حاکم</button>

        <div id="hokmInfo"></div>

      </div>

      <div id="gameArea">

        <h2>👑 حاکم: <span id="kingName"></span></h2>

        <p>۵ کارت اول حاکم:</p>

        <div id="cards" class="cards"></div>

        <div id="trumpArea">

          <h3>خال حکم را انتخاب کنید:</h3>

          <button class="suit-button" onclick="chooseTrump('♠')">♠</button>

          <button class="suit-button red-button" onclick="chooseTrump('♥')">♥</button>

          <button class="suit-button red-button" onclick="chooseTrump('♦')">♦</button>

          <button class="suit-button" onclick="chooseTrump('♣')">♣</button>

        </div>

        <div id="info" class="message">
          منتظر انتخاب حکم...
        </div>

        <div id="myHandArea" style="display:none;">

          <h2>🎴 دست شما</h2>

          <div id="myHand" class="cards"></div>

        </div>


          <div id="currentTrick" class="cards"></div>

        </div>

      </div>

    </div>

  </div>

  <script>

    const suits = ["♠", "♥", "♦", "♣"];

    const ranks = [
      "A", "K", "Q", "J", "10",
      "9", "8", "7", "6", "5",
      "4", "3", "2"
    ];

    const players = [
      "شما",
      "بازیکن ۲",
      "بازیکن ۳",
      "بازیکن ۴"
    ];

    let deck = [];
    let king = "";
    let nextKing = "";
    let trump = "";
    let kingFirstFive = [];

    let hands = {
      "شما": [],
      "بازیکن ۲": [],
      "بازیکن ۳": [],
      "بازیکن ۴": []
    };

    let currentTrick = [];
    let leadSuit = "";
let trickLeader = "شما";
    let currentPlayer = "شما";
    let teamScore = 0;
let opponentScore = 0;

function addTrickPoint(winner) {

  if (winner === "شما" || winner === "بازیکن ۲") {
    teamScore++;
  } else {
    opponentScore++;
  }

  document.getElementById("info").textContent =
    "🏆 شما و یارت: " + teamScore +
    " | حریف: " + opponentScore;
    }
    function createDeck() {

      deck = [];

      for (let suit of suits) {

        for (let rank of ranks) {

          deck.push({
            suit: suit,
            rank: rank
          });

        }

      }

    }

    function shuffleDeck() {

      for (let i = deck.length - 1; i > 0; i--) {

        const j =
          Math.floor(Math.random() * (i + 1));

        const temp = deck[i];

        deck[i] = deck[j];

        deck[j] = temp;

      }

    }

  
function chooseHokm() {

  createDeck();
  shuffleDeck();

  let hokmKing = null;

  while (!hokmKing) {

    for (let player of players) {

      const card = deck.pop();

      document.getElementById("hokmInfo").textContent =
        "🃏 کارت حاکم برای " + player + ": " +
        card.rank + card.suit;

      if (card.rank === "A") {

        hokmKing = player;
        break;

      }

    }

  }

  king = hokmKing;

  createDeck();
  shuffleDeck();

  kingFirstFive = deck.slice(0, 5);

  document.getElementById("hokmInfo").textContent =
    "👑 حاکم شد: " + king;

  setTimeout(function() {

  document.getElementById("startArea").style.display = "none";

  document.getElementById("gameArea").style.display = "block";

  document.getElementById("kingName").textContent = king;

  if (king === "شما") {

    showCards(
      kingFirstFive,
      document.getElementById("cards")
    );

    document.getElementById("trumpArea").style.display = "block";

    document.getElementById("info").textContent =
      "🎴 ۵ کارت شما؛ خال حکم را انتخاب کنید.";

  } else {

       const suitScores = {
      "♠": 0,
      "♥": 0,
      "♦": 0,
      "♣": 0
    };

    for (let card of kingFirstFive) {

      let value = ranks.indexOf(card.rank);

      if (value < 0) {
        value = 12;
      }

      suitScores[card.suit] += (13 - value);

    }

    const maxScore =
      Math.max(
        suitScores["♠"],
        suitScores["♥"],
        suitScores["♦"],
        suitScores["♣"]
      );

    const bestSuits =
      Object.keys(suitScores).filter(function(suit) {
        return suitScores[suit] === maxScore;
      });

    const botTrump =
      bestSuits[
        Math.floor(Math.random() * bestSuits.length)
      ];

    document.getElementById("cards").innerHTML = "";

    document.getElementById("trumpArea").style.display = "none";

        chooseTrump(botTrump); 

  }

}, 1200);

    } 

    function showCards(cardList, area) {

      area.innerHTML = "";

      for (let card of cardList) {

        const cardElement =
          document.createElement("div");

        cardElement.className = "card";

        if (
          card.suit === "♥" ||
          card.suit === "♦"
        ) {

          cardElement.classList.add("red");

        }

        cardElement.textContent =
          card.rank + card.suit;

        area.appendChild(cardElement);

      }

    }
function showOpponentHands() {

  const top = document.getElementById("handTop");
  const left = document.getElementById("handLeft");
  const right = document.getElementById("handRight");

  top.innerHTML = "";
  left.innerHTML = "";
  right.innerHTML = "";

  for (let i = 0; i < hands["بازیکن ۲"].length; i++) {
    const card = document.createElement("div");
    card.className = "backCard";
    top.appendChild(card);
  }

  for (let i = 0; i < hands["بازیکن ۳"].length; i++) {
    const card = document.createElement("div");
    card.className = "backCard";
    left.appendChild(card);
  }

  for (let i = 0; i < hands["بازیکن ۴"].length; i++) {
    const card = document.createElement("div");
    card.className = "backCard";
    right.appendChild(card);
  }

    }
    function chooseTrump(selectedSuit) {

      trump = selectedSuit;

      document.getElementById("info").textContent =
        "حکم انتخاب شد: " + trump + " 🃏";

      document.getElementById("trumpArea").innerHTML =
        "<h3>حکم بازی: " + trump + "</h3>";

      dealAllCards();

    }

    function dealAllCards() {
teamScore = 0;
opponentScore = 0;
      hands = {
        "شما": [],
        "بازیکن ۲": [],
        "بازیکن ۳": [],
        "بازیکن ۴": []
      };

      let remainingDeck =
        deck.slice(5);

      hands[king] =
        kingFirstFive.slice();

      hands[king] =
        hands[king].concat(
          remainingDeck.slice(0, 8)
        );

      let position = 8;

      for (let player of players) {

        if (player === king) {
          continue;
        }

        hands[player] =
          remainingDeck.slice(
            position,
            position + 13
          );

        position += 13;

      }

      trickLeader = king;
currentPlayer = king;
showOpponentHands();
if (king === "شما") {
  showMyHand();
} else {
  document.getElementById("info").textContent =
    "🎴 نوبت " + king + " است.";
  playNextPlayer();
    }

    }
function showMyHand() {

  const myHandArea =
    document.getElementById("myHandArea");

  const myHand =
    document.getElementById("myHand");

  myHandArea.style.display = "block";

  myHand.innerHTML = "";

  const sortedHand = [...hands["شما"]].sort(function(a, b) {

    const suitOrder = {
      "♠": 0,
      "♥": 1,
      "♦": 2,
      "♣": 3
    };

    if (suitOrder[a.suit] !== suitOrder[b.suit]) {
      return suitOrder[a.suit] - suitOrder[b.suit];
    }

    return ranks.indexOf(a.rank) - ranks.indexOf(b.rank);

  });

  sortedHand.forEach(function(card, index) {

    const cardElement =
      document.createElement("div");

    cardElement.className = "card";

    if (
      card.suit === "♥" ||
      card.suit === "♦"
    ) {

      cardElement.classList.add("red");

    }

    cardElement.textContent =
      card.rank + card.suit;

    cardElement.onclick = function() {

      const realIndex =
        hands["شما"].indexOf(card);

      playMyCard(realIndex);

    };

    myHand.appendChild(cardElement);

  });

  if (currentPlayer === "شما") {

    document.getElementById("info").textContent =
      "🎴 نوبت شماست؛ یک کارت انتخاب کنید.";

  } else {

    document.getElementById("info").textContent =
      "🎴 نوبت " + currentPlayer + " است.";

  }

    }

    function playMyCard(index) {
if (currentPlayer !== "شما") {

  document.getElementById("info").textContent =
    "⏳ الان نوبت " + currentPlayer + " است.";

  return;

    }
      const card =
        hands["شما"][index];

      /*
        اگر خال شروع مشخص شده باشد
        و شما از آن خال داشته باشید،
        باید همان خال را بازی کنید.
      */

      if (currentTrick.length > 0) {

  const actualLeadSuit =
    currentTrick[0].card.suit;

  if (
    hasSuit("شما", actualLeadSuit) &&
    card.suit !== actualLeadSuit
  ) {

    document.getElementById("info").textContent =
      "⚠️ باید از خال " +
      actualLeadSuit +
      " بازی کنید.";

    return;
  }
    }

      if (currentTrick.length === 0) {

        leadSuit = card.suit;

      }

      currentTrick.push({
        player: "شما",
        card: card
      });

      hands["شما"].splice(index, 1);
currentPlayer =
  players[
    (players.indexOf(currentPlayer) + 1)
    % players.length
  ];
      showCurrentTrick();
playNextPlayer();
      

    }

    function hasSuit(player, suit) {

      return hands[player].some(
        function(card) {
          return card.suit === suit;
        }
      );

    }

    function showCurrentTrick() {

      const area =
        document.getElementById("currentTrick");

      area.innerHTML = "";

      for (let play of currentTrick) {

        const box =
          document.createElement("div");

        box.className = "card";

        if (
          play.card.suit === "♥" ||
          play.card.suit === "♦"
        ) {

          box.classList.add("red");

        }

        box.textContent =
          play.player +
          " " +
          play.card.rank +
          play.card.suit;

        area.appendChild(box);

      }

    }

function playNextPlayer() {
  const nextPlayer = currentPlayer;

  if (nextPlayer === "شما") {
    showMyHand();
    return;
  }

  const validCards =
    hands[nextPlayer].filter(function(card) {

      if (leadSuit === "") {
        return true;
      }

      if (hasSuit(nextPlayer, leadSuit)) {
        return card.suit === leadSuit;
      }

      return true;

    });

  if (validCards.length === 0) {
    return;
  }

  const randomCard =
    validCards[
      Math.floor(Math.random() * validCards.length)
    ];

  const cardIndex =
    hands[nextPlayer].indexOf(randomCard);

  hands[nextPlayer].splice(cardIndex, 1);

  currentTrick.push({
    player: nextPlayer,
    card: randomCard
  });
if (currentTrick.length === 1) {
  leadSuit = randomCard.suit;
    }
  showCurrentTrick();

  currentPlayer =
    players[
      (players.indexOf(nextPlayer) + 1)
      % players.length
    ];

  if (currentTrick.length < 4) {

    if (currentPlayer === "شما") {

      showMyHand();

    } else {

      setTimeout(function() {
        playNextPlayer();
      }, 700);

    }

    return;
  }

  const winner = findTrickWinner();

  addTrickPoint(winner);
  if (teamScore >= 7 || opponentScore >= 7) {

  const winningTeam =
    teamScore >= 7 ? "شما و یارت" : "حریف";
if (teamScore >= 7) {
  nextKing = "شما";
} else {
  nextKing = "بازیکن ۳";
    }
  document.getElementById("info").textContent =
    "🏆 " + winningTeam + " برنده این دست شد!";

  return;
    }
  trickLeader = winner;
  currentPlayer = winner;

  document.getElementById("info").textContent =
    "🏆 برنده این دور: " + winner;

  setTimeout(function() {

    currentTrick = [];
    leadSuit = "";

    showCurrentTrick();

    if (trickLeader === "شما") {

      showMyHand();

    } else {

      document.getElementById("info").textContent =
        "🎴 نوبت " + trickLeader + " است.";

      playNextPlayer();

    }

  }, 1500);

    }
    function findTrickWinner() {
  const lead = currentTrick[0].card.suit;

  let winner = currentTrick[0];

  for (let i = 1; i < currentTrick.length; i++) {

    const current = currentTrick[i];

    if (
      current.card.suit === trump &&
      winner.card.suit !== trump
    ) {
      winner = current;
      continue;
    }

    if (
      current.card.suit === winner.card.suit &&
      current.card.suit === trump
    ) {
      if (
        ranks.indexOf(current.card.rank) <
        ranks.indexOf(winner.card.rank)
      ) {
        winner = current;
      }
      continue;
    }

    if (
      winner.card.suit !== trump &&
      current.card.suit === lead &&
      winner.card.suit === lead
    ) {
      if (
        ranks.indexOf(current.card.rank) <
        ranks.indexOf(winner.card.rank)
      ) {
        winner = current;
      }
    }

  }

  return winner.player;
    
    }
  </script>

</body>
  </html>
