<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>حکم | Bi Hava Games</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Tahoma, Arial, sans-serif;
      background:
        radial-gradient(
          circle at top,
          #263b32 0%,
          #10231c 48%,
          #08130f 100%
        );
      color: white;
    }

    button {
      font-family: inherit;
    }


    /* =========================
       صفحه انتخاب نوع بازی
    ========================= */

    #modePage {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .page {
      width: 100%;
      max-width: 430px;
      text-align: center;
    }

    .top {
      margin-bottom: 35px;
    }

    .crown {
      font-size: 48px;
      margin-bottom: 10px;
    }

    h1 {
      font-size: 30px;
      margin-bottom: 10px;
    }

    .subtitle {
      color: #c8d4cf;
      font-size: 15px;
      line-height: 1.8;
    }

    .options {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .game-option {
      width: 100%;
      border: none;
      border-radius: 20px;
      padding: 19px 18px;
      background: rgba(255,255,255,0.09);
      border: 1px solid rgba(255,255,255,0.12);
      color: white;
      display: flex;
      align-items: center;
      text-align: right;
      cursor: pointer;
      transition: 0.2s;
    }

    .game-option:active {
      transform: scale(0.97);
      background: rgba(255,255,255,0.16);
    }

    .icon {
      width: 54px;
      height: 54px;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      background: rgba(255,255,255,0.12);
      font-size: 27px;
      margin-left: 15px;
      flex-shrink: 0;
    }

    .text {
      flex: 1;
    }

    .title {
      display: block;
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 6px;
    }

    .description {
      display: block;
      color: #b9c8c1;
      font-size: 12px;
      line-height: 1.6;
    }

    .arrow {
      font-size: 22px;
      color: #9db0a7;
      margin-right: 8px;
    }

    .back {
      margin-top: 25px;
      background: transparent;
      border: none;
      color: #b8c7c0;
      font-size: 14px;
      padding: 10px 20px;
      cursor: pointer;
    }


    /* =========================
       اتاق انتظار عمومی
    ========================= */

    #publicRoom {
      display: none;
      min-height: 100vh;
      padding: 18px;
      position: relative;
    }

    .room-header {
      height: 55px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .room-title {
      font-size: 20px;
      font-weight: bold;
    }

    .exit-button {
      width: 42px;
      height: 42px;
      border: 0;
      border-radius: 13px;
      background: rgba(255,255,255,0.09);
      color: white;
      font-size: 20px;
      cursor: pointer;
    }

    .room-info {
      text-align: center;
      color: #aebfb8;
      font-size: 13px;
      margin-bottom: 15px;
    }


    /* میز */

    .table-area {
      position: relative;
      width: 100%;
      max-width: 430px;
      height: 470px;
      margin: 0 auto;
    }

    .table {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);

      width: 230px;
      height: 300px;

      border-radius: 48%;
      background:
        radial-gradient(
          ellipse at center,
          #1e5b42 0%,
          #164633 65%,
          #103126 100%
        );

      border: 4px solid rgba(255,255,255,0.08);

      box-shadow:
        0 15px 40px rgba(0,0,0,0.4),
        inset 0 0 30px rgba(0,0,0,0.25);
    }

    .table-text {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 100%;
      text-align: center;
      color: rgba(255,255,255,0.35);
      font-size: 13px;
    }


    /* جایگاه بازیکنان */

    .seat {
      position: absolute;
      width: 100px;
      text-align: center;
    }

    .seat-top {
      top: 0;
      left: 50%;
      transform: translateX(-50%);
    }

    .seat-bottom {
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
    }

    .seat-left {
      left: 0;
      top: 50%;
      transform: translateY(-50%);
    }

    .seat-right {
      right: 0;
      top: 50%;
      transform: translateY(-50%);
    }


    .avatar {
      width: 62px;
      height: 62px;
      margin: 0 auto 7px;

      border-radius: 50%;

      background: #263e35;

      border: 2px solid rgba(255,255,255,0.15);

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 28px;

      overflow: hidden;
    }

    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .player-name {
      font-size: 12px;
      font-weight: bold;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }


    /* جای خالی */

    .empty-seat {
      cursor: pointer;
    }

    .empty-seat .avatar {
      border: 2px dashed rgba(255,255,255,0.25);
      background: rgba(255,255,255,0.05);
      color: #8fa49b;
      font-size: 25px;
    }

    .empty-seat .player-name {
      color: #8fa49b;
    }


    /* شمارش معکوس */

    .countdown {
      position: absolute;

      left: 50%;
      top: 50%;

      transform: translate(-50%, -50%);

      width: 70px;
      height: 70px;

      border-radius: 50%;

      background: rgba(7,24,17,0.82);

      border: 3px solid rgba(255,255,255,0.15);

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      z-index: 5;

      box-shadow: 0 5px 20px rgba(0,0,0,0.35);
    }

    .countdown-number {
      font-size: 25px;
      font-weight: bold;
    }

    .countdown-text {
      font-size: 8px;
      color: #9daf a8;
      color: #9daea8;
      margin-top: 2px;
    }


    /* دعوت */

    .invite-hint {
      text-align: center;
      color: #879b93;
      font-size: 11px;
      margin-top: 5px;
    }


    /* =========================
       پنجره خروج
    ========================= */

    .modal-overlay {
      position: fixed;
      inset: 0;

      background: rgba(0,0,0,0.7);

      display: none;

      align-items: center;
      justify-content: center;

      padding: 20px;

      z-index: 100;
    }

    .modal-overlay.show {
      display: flex;
    }

    .exit-modal {
      width: 100%;
      max-width: 340px;

      background: #152b23;

      border-radius: 22px;

      padding: 24px 20px;

      text-align: center;

      box-shadow: 0 15px 50px rgba(0,0,0,0.5);
    }

    .modal-icon {
      font-size: 42px;
      margin-bottom: 12px;
    }

    .exit-modal h2 {
      font-size: 19px;
      margin-bottom: 8px;
    }

    .exit-modal p {
      color: #9daf a8;
      color: #9daea8;
      font-size: 12px;
      line-height: 1.8;
      margin-bottom: 20px;
    }

    .modal-buttons {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .modal-button {
      width: 100%;
      padding: 13px;

      border-radius: 14px;

      border: 0;

      color: white;

      font-size: 14px;

      cursor: pointer;
    }

    .leave-button {
      background: #7b302d;
    }

    .stay-button {
      background: #29483b;
    }

  </style>

</head>


<body>


  <!-- =================================
       صفحه انتخاب نوع بازی
  ================================== -->

  <section id="modePage">

    <div class="page">

      <div class="top">

        <div class="crown">
          👑
        </div>

        <h1>
          بازی حکم
        </h1>

        <p class="subtitle">
          نوع بازی خودت رو انتخاب کن
        </p>

      </div>


      <div class="options">


        <!-- تک نفره -->

        <button
          class="game-option"
          onclick="singlePlayer()"
        >

          <div class="icon">
            🤖
          </div>

          <div class="text">

            <span class="title">
              بازی تک نفره با ربات‌ها
            </span>

            <span class="description">
              بازی حکم با سه بازیکن ربات
            </span>

          </div>

          <div class="arrow">
            ‹
          </div>

        </button>


        <!-- عمومی -->

        <button
          class="game-option"
          onclick="publicGame()"
        >

          <div class="icon">
            🌐
          </div>

          <div class="text">

            <span class="title">
              بازی عمومی
            </span>

            <span class="description">
              وارد یک میز عمومی شو و با بازیکنان دیگر بازی کن
            </span>

          </div>

          <div class="arrow">
            ‹
          </div>

        </button>


        <!-- دوستان -->

        <button
          class="game-option"
          onclick="friendsGame()"
        >

          <div class="icon">
            👥
          </div>

          <div class="text">

            <span class="title">
              بازی با دوستان
            </span>

            <span class="description">
              دوستانت را دعوت کن و یک میز خصوصی بساز
            </span>

          </div>

          <div class="arrow">
            ‹
          </div>

        </button>


      </div>


      <button
        class="back"
        onclick="goBack()"
      >
        ← بازگشت
      </button>

    </div>

  </section>



  <!-- =================================
       اتاق انتظار بازی عمومی
  ================================== -->

  <section id="publicRoom">


    <header class="room-header">

      <div class="room-title">
        بازی عمومی
      </div>

      <button
        class="exit-button"
        onclick="openExitModal()"
      >
        ✕
      </button>

    </header>


    <div class="room-info">

      منتظر بازیکنان دیگر هستیم...

    </div>


    <div class="table-area">


      <!-- میز -->

      <div class="table">

        <div class="table-text">
          میز حکم
        </div>

      </div>


      <!-- بازیکن بالا -->

      <div
        class="seat seat-top empty-seat"
        onclick="invitePlayer('بالا')"
      >

        <div class="avatar">
          ＋
        </div>

        <div class="player-name">
          دعوت بازیکن
        </div>

      </div>


      <!-- بازیکن پایین / خود کاربر -->

      <div
        class="seat seat-bottom"
      >

        <div
          class="avatar"
          id="myAvatar"
        >
          👤
        </div>

        <div
          class="player-name"
          id="myName"
        >
          شما
        </div>

      </div>


      <!-- بازیکن چپ -->

      <div
        class="seat seat-left empty-seat"
        onclick="invitePlayer('چپ')"
      >

        <div class="avatar">
          ＋
        </div>

        <div class="player-name">
          دعوت بازیکن
        </div>

      </div>


      <!-- بازیکن راست -->

      <div
        class="seat seat-right empty-seat"
        onclick="invitePlayer('راست')"
      >

        <div class="avatar">
          ＋
        </div>

        <div class="player-name">
          دعوت بازیکن
        </div>

      </div>


      <!-- شمارش معکوس -->

      <div
        id="countdown"
        class="countdown"
        style="display:none;"
      >

        <div
          id="countdownNumber"
          class="countdown-number"
        >
          30
        </div>

        <div class="countdown-text">
          ثانیه
        </div>

      </div>


    </div>


    <div class="invite-hint">

      برای جای خالی روی علامت ＋ بزن

    </div>


  </section>



  <!-- =================================
       پنجره خروج
  ================================== -->

  <div
    id="exitModal"
    class="modal-overlay"
  >

    <div class="exit-modal">

      <div class="modal-icon">
        🚪
      </div>

      <h2>
        می‌خواهی از بازی خارج شوی؟
      </h2>

      <p>
        اگر خارج شوی از اتاق انتظار خارج می‌شوی.
      </p>


      <div class="modal-buttons">

        <button
          class="modal-button leave-button"
          onclick="leaveGame()"
        >
          خروج از بازی
        </button>

        <button
          class="modal-button stay-button"
          onclick="closeExitModal()"
        >
          نه، توی بازی می‌مونم
        </button>

      </div>

    </div>

  </div>



  <script>


    /* =========================
       Telegram
    ========================= */

    const tg = window.Telegram?.WebApp;

    if (tg) {
      tg.ready();
      tg.expand();
    }


    /* =========================
       اطلاعات کاربر
    ========================= */

    let currentUser = {
      name: "شما",
      photo: ""
    };


    function loadUser() {

      const user = tg?.initDataUnsafe?.user;

      if (!user) {
        return;
      }


      let name = "";

      if (user.first_name) {
        name += user.first_name;
      }

      if (user.last_name) {
        name += " " + user.last_name;
      }

      if (!name) {
        name = "شما";
      }


      currentUser.name = name;


      if (user.photo_url) {
        currentUser.photo = user.photo_url;
      }


      document.getElementById("myName").textContent =
        currentUser.name;


      if (currentUser.photo) {

        const avatar =
          document.getElementById("myAvatar");

        avatar.innerHTML = "";

        const img =
          document.createElement("img");

        img.src = currentUser.photo;

        img.alt = "profile";

        avatar.appendChild(img);

      }

    }


    loadUser();



    /* =========================
       رفتن به صفحه عمومی
    ========================= */

    let countdownTimer = null;

    let secondsLeft = 30;


    function publicGame() {

      document.getElementById("modePage").style.display =
        "none";

      document.getElementById("publicRoom").style.display =
        "block";


      startPublicCountdown();

    }



    /* =========================
       شمارش ۳۰ ثانیه
    ========================= */

    function startPublicCountdown() {

      secondsLeft = 30;


      const countdown =
        document.getElementById("countdown");

      const number =
        document.getElementById("countdownNumber");


      countdown.style.display = "flex";

      number.textContent = secondsLeft;


      clearInterval(countdownTimer);


      countdownTimer = setInterval(function() {

        secondsLeft--;

        number.textContent = secondsLeft;


        if (secondsLeft <= 0) {

          clearInterval(countdownTimer);

          fillEmptySeatsWithBots();

        }

      }, 1000);

    }



    /* =========================
       پر کردن جای خالی با ربات
    ========================= */

    function fillEmptySeatsWithBots() {

      alert(
        "زمان انتظار تمام شد؛ جای خالی با ربات پر می‌شود."
      );

    }



    /* =========================
       دعوت بازیکن
    ========================= */

    function invitePlayer(position) {

      alert(
        "انتخاب دوست آنلاین برای جایگاه " +
        position +
        " در مرحله بعد اضافه می‌شود."
      );

    }



    /* =========================
       خروج
    ========================= */

    function openExitModal() {

      document
        .getElementById("exitModal")
        .classList.add("show");

    }


    function closeExitModal() {

      document
        .getElementById("exitModal")
        .classList.remove("show");

    }


    function leaveGame() {

      clearInterval(countdownTimer);

      closeExitModal();


      document.getElementById("publicRoom").style.display =
        "none";

      document.getElementById("modePage").style.display =
        "flex";

    }



    /* =========================
       تک نفره
    ========================= */

    function singlePlayer() {

      alert(
        "بخش بازی تک نفره با ربات‌ها در مرحله بعد ساخته می‌شود."
      );

    }



    /* =========================
       دوستان
    ========================= */

    function friendsGame() {

      alert(
        "بخش بازی با دوستان در مرحله بعد ساخته می‌شود."
      );

    }



    /* =========================
       بازگشت
    ========================= */

    function goBack() {

      if (window.history.length > 1) {

        window.history.back();

      } else {

        window.location.href = "index.html";

      }

    }

  </script>

</body>
  </html>
