<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>حکم | Bi Hava Games</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Tahoma, Arial, sans-serif;
      background:
        radial-gradient(circle at top, #263b32 0%, #10231c 45%, #08130f 100%);
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .page {
      width: 100%;
      max-width: 430px;
      text-align: center;
    }

    .top {
      margin-bottom: 35px;
    }

    .crown {
      font-size: 48px;
      margin-bottom: 10px;
    }

    h1 {
      font-size: 30px;
      margin-bottom: 10px;
    }

    .subtitle {
      color: #c8d4cf;
      font-size: 15px;
      line-height: 1.8;
    }

    .options {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .game-option {
      width: 100%;
      border: none;
      border-radius: 20px;
      padding: 19px 18px;
      background: rgba(255,255,255,0.09);
      border: 1px solid rgba(255,255,255,0.12);
      color: white;
      display: flex;
      align-items: center;
      text-align: right;
      cursor: pointer;
      transition: 0.2s;
    }

    .game-option:active {
      transform: scale(0.97);
      background: rgba(255,255,255,0.16);
    }

    .icon {
      width: 54px;
      height: 54px;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      background: rgba(255,255,255,0.12);
      font-size: 27px;
      margin-left: 15px;
      flex-shrink: 0;
    }

    .text {
      flex: 1;
    }

    .title {
      display: block;
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 6px;
    }

    .description {
      display: block;
      color: #b9c8c1;
      font-size: 12px;
      line-height: 1.6;
    }

    .arrow {
      font-size: 22px;
      color: #9db0a7;
      margin-right: 8px;
    }

    .back {
      margin-top: 25px;
      background: transparent;
      border: none;
      color: #b8c7c0;
      font-size: 14px;
      padding: 10px 20px;
      cursor: pointer;
    }

    .back:active {
      opacity: 0.6;
    }
  </style>
</head>

<body>

  <div class="page">

    <div class="top">
      <div class="crown">👑</div>

      <h1>بازی حکم</h1>

      <p class="subtitle">
        نوع بازی خودت رو انتخاب کن
      </p>
    </div>


    <div class="options">

      <!-- بازی تک نفره -->
      <button class="game-option" onclick="singlePlayer()">

        <div class="icon">🤖</div>

        <div class="text">
          <span class="title">بازی تک نفره با ربات‌ها</span>
          <span class="description">
            بازی حکم با سه بازیکن ربات
          </span>
        </div>

        <div class="arrow">‹</div>

      </button>


      <!-- بازی عمومی -->
      <button class="game-option" onclick="publicGame()">

        <div class="icon">🌐</div>

        <div class="text">
          <span class="title">بازی عمومی</span>
          <span class="description">
            وارد یک میز عمومی شو و با بازیکنان دیگر بازی کن
          </span>
        </div>

        <div class="arrow">‹</div>

      </button>


      <!-- بازی با دوستان -->
      <button class="game-option" onclick="friendsGame()">

        <div class="icon">👥</div>

        <div class="text">
          <span class="title">بازی با دوستان</span>
          <span class="description">
            دوستانت را دعوت کن و یک میز خصوصی بساز
          </span>
        </div>

        <div class="arrow">‹</div>

      </button>

    </div>


    <button class="back" onclick="goBack()">
      ← بازگشت
    </button>

  </div>


  <script>

    // اتصال به تلگرام
    const tg = window.Telegram?.WebApp;

    if (tg) {
      tg.ready();
      tg.expand();
    }


    // بازی تک نفره
    function singlePlayer() {
      alert("بازی تک نفره با ربات‌ها");
    }


    // بازی عمومی
    function publicGame() {
      alert("بازی عمومی");
    }


    // بازی با دوستان
    function friendsGame() {
      alert("بازی با دوستان");
    }


    // برگشت به صفحه اصلی
    function goBack() {

      if (window.history.length > 1) {
        window.history.back();
      } else {
        window.location.href = "index.html";
      }

    }

  </script>

</body>
            </html>
